# The Broken Wood - Full Stack Blueprint
# Landing Page + Admin Dashboard + Vendor Portal + QA Agent

databases:
  - name: tbw-database
    plan: free
    databaseName: tbw
    user: tbw

services:
  # Landing Page (Marketing Site)
  - type: web
    name: tbw-landing
    runtime: node
    plan: free
    rootDir: apps/landing
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tbw-database
          property: connectionString
      - key: NEXT_PUBLIC_DASHBOARD_URL
        fromService:
          type: web
          name: tbw-dashboard
          property: host

  # Admin Dashboard
  - type: web
    name: tbw-dashboard
    runtime: node
    plan: free
    rootDir: apps/dashboard
    buildCommand: npm install --legacy-peer-deps && ./node_modules/.bin/prisma generate && ./node_modules/.bin/prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tbw-database
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false

  # Vendor Portal
  - type: web
    name: tbw-vendor-portal
    runtime: node
    plan: free
    rootDir: apps/vendor-portal
    buildCommand: npm install --legacy-peer-deps && ./node_modules/.bin/prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tbw-database
          property: connectionString

  # QA Agent (NestJS Backend)
  - type: web
    name: tbw-qa-agent
    runtime: node
    plan: free
    rootDir: apps/qa-agent
    buildCommand: npm install --legacy-peer-deps && HOME=/tmp ./node_modules/.bin/prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tbw-database
          property: connectionString
