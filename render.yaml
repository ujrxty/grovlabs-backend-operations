# GrovLabs - Full Stack Blueprint
# Admin Dashboard + Vendor Portal + QA Agent
# Landing page deployed separately on Vercel
# Most settings configurable via Dashboard Settings page

databases:
  - name: grovlabs-database
    plan: free
    databaseName: grovlabs
    user: grovlabs

services:
  # Admin Dashboard
  - type: web
    name: grovlabs-dashboard
    runtime: node
    plan: free
    rootDir: apps/dashboard
    buildCommand: npm install --legacy-peer-deps && ./node_modules/.bin/prisma generate && ./node_modules/.bin/prisma db push && ./node_modules/.bin/prisma db seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: grovlabs-database
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false

  # Vendor Portal
  - type: web
    name: grovlabs-vendor-portal
    runtime: node
    plan: free
    rootDir: apps/vendor-portal
    buildCommand: npm install --legacy-peer-deps && ./node_modules/.bin/prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: grovlabs-database
          property: connectionString

  # QA Agent (NestJS Backend)
  - type: web
    name: grovlabs-qa-agent
    runtime: node
    plan: free
    rootDir: apps/qa-agent/nodejs_space
    buildCommand: npm install --legacy-peer-deps && ./node_modules/.bin/prisma generate && ./node_modules/.bin/prisma db push && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: grovlabs-database
          property: connectionString
